name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: BUILD AND DEPLOY FRONTEND
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        working-directory: starter/frontend
        run: npm install

      - name: Build React application
        working-directory: starter/frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: starter/frontend
          push: true
          build-args: |
            REACT_APP_MOVIE_API_URL=http://a6c2e222a02084a508b09e71143cecb5-1823154042.us-east-1.elb.amazonaws.com:5000
          tags: |
            218549830224.dkr.ecr.us-east-1.amazonaws.com/movie-frontend:latest

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name movie-picture-eks

      - name: Deploy frontend to EKS
        run: |
          kubectl set image deployment/movie-frontend \
            frontend=218549830224.dkr.ecr.us-east-1.amazonaws.com/movie-frontend:latest

          kubectl rollout status deployment/movie-frontend --timeout=180s