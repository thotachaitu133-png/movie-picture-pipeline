name: Backend Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: BUILD AND DEPLOY BACKEND
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: starter/backend
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/movie-backend:latest

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Deploy backend to EKS
        run: |
          kubectl set image deployment/movie-backend \
            backend=${{ secrets.ECR_REGISTRY }}/movie-backend:latest

          kubectl rollout status deployment/movie-backend --timeout=180s